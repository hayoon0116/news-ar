<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEWS AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
}

#guide {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    font-family: Arial, sans-serif;
    white-space: nowrap;
}

#playButton {
    display: none;
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    border: none;
    border-radius: 30px;
    padding: 14px 24px;
    background: rgba(0,0,0,0.8);
    color: white;
    font-size: 17px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="guide">📰 뉴스 스크랩을 비춰보세요</div>

<button id="playButton">🔊 영상 재생</button>

<a-scene
    mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiScanning: true;
        uiLoading: true;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

        <video id="video0" src="./news.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

        <video id="video1" src="./news2.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

        <video id="video2" src="./news3.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

        <video id="video3" src="./news4.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

        <video id="video4" src="./news5.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

        <video id="video5" src="./news6.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

        <video id="video6" src="./news7.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

        <video id="video7" src="./news8.mp4"
            playsinline webkit-playsinline preload="auto"
            loop crossorigin="anonymous"></video>

    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#video0"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#video1"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
        <a-video src="#video2"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
        <a-video src="#video3"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
        <a-video src="#video4"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 5">
        <a-video src="#video5"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 6">
        <a-video src="#video6"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 7">
        <a-video src="#video7"
            position="0 0 0"
            width="1"
            height="0.5625">
        </a-video>
    </a-entity>

</a-scene>

<script>

const guide = document.getElementById('guide');
const playButton = document.getElementById('playButton');

const videos = [
    document.getElementById('video0'),
    document.getElementById('video1'),
    document.getElementById('video2'),
    document.getElementById('video3'),
    document.getElementById('video4'),
    document.getElementById('video5'),
    document.getElementById('video6'),
    document.getElementById('video7')
];

let currentVideo = null;

document.querySelectorAll('[mindar-image-target]').forEach((target, index) => {

    target.addEventListener('targetFound', () => {

        if (currentVideo && currentVideo !== videos[index]) {
            currentVideo.pause();
        }

        currentVideo = videos[index];

        guide.innerHTML = '🎥 기사를 찾았습니다!';
        playButton.style.display = 'block';
        playButton.innerHTML = '🔊 영상 재생';

    });

    target.addEventListener('targetLost', () => {

        if (currentVideo === videos[index]) {

            currentVideo.pause();
            currentVideo = null;

            guide.innerHTML = '📰 뉴스 스크랩을 비춰보세요';
            playButton.style.display = 'none';
            playButton.innerHTML = '🔊 영상 재생';

        }

    });

});

playButton.addEventListener('click', async () => {

    if (!currentVideo) return;

    try {

        if (currentVideo.paused) {

            currentVideo.muted = false;
            currentVideo.volume = 1.0;

            await currentVideo.play();

            playButton.innerHTML = '⏸ 영상 일시정지';

        } else {

            currentVideo.pause();

            playButton.innerHTML = '🔊 영상 재생';

        }

    } catch (error) {

        guide.innerHTML = '⚠️ 영상을 재생할 수 없어요';

        console.error(error);

    }

});

</script>

</body>
</html>
